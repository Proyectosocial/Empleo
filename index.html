<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Empleo Técnico</title><link rel="stylesheet" href="style.css">
</head>
<body>
<header><div class="wrap"><h1>🔎 Empleo Técnico</h1><p>Buscador interactivo de oportunidades laborales</p></div></header>
<main class="wrap">
<section class="controls">
<label class="free-search">Búsqueda libre
<input id="freeSearch" type="search" placeholder="Ej. pintor, administrativo, chofer..." autocomplete="off">
</label>
<label>Categoría<select id="cat"></select></label>
<label>Zona
<select id="zone">
<option value="">Todas las zonas</option>
<option value="caba">Ciudad de Buenos Aires (CABA)</option>
<option value="norte">Gran Buenos Aires — Zona Norte</option>
<option value="oeste">Gran Buenos Aires — Zona Oeste</option>
<option value="sur">Gran Buenos Aires — Zona Sur</option>
</select>
</label>
<label>Localidad
<select id="where">
<option value="">Todas las localidades</option>
</select>
</label>
<button id="go">Buscar</button><button id="refresh" class="secondary">Actualizar</button>
</section>
<div id="status"></div><div id="jobs"></div>
</main>
<div id="jobModal" class="modal" aria-hidden="true">
  <div class="modal-card">
    <button id="closeModal" class="modal-close" aria-label="Cerrar">×</button>
    <div id="modalContent"></div>
  </div>
</div>
<script src="app.js"></script>
</body></html>
